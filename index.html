<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGOPEPEN</title>
  <meta name="description" content="Dual-head symmetrical Opepen generator for Argonauts NFTs directly from Ethereum smart contracts.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260905_uipolish_v3">
</head>
<body>
  <div class="app-container">
    <!-- Minimalist Header -->
    <header class="header">
      <div class="brand">
        <span class="brand-glyph">◈</span>
        <span class="brand-name">ARGOPEPEN</span>
      </div>

      <nav class="nav">
        <span class="nav-explore-label">EXPLORE</span>
        <div class="nav-explore-links">
          <a href="https://argonauts.musefacktory.com/" target="_blank" rel="noopener noreferrer" class="nav-icon-link" title="The Argonauts (Muse Facktory)">
            <img src="mf-logo.png" alt="The Argonauts" class="nav-site-icon mf-icon" />
          </a>
          <a href="https://opepen.art/sets/030" target="_blank" rel="noopener noreferrer" class="nav-icon-link" title="Opepen Set 030">
            <svg class="nav-site-icon opepen-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0 3.2C0 1.43269 1.43269 0 3.2 0H32C49.6731 0 64 14.3269 64 32V32C64 49.6731 49.6731 64 32 64V64C14.3269 64 0 49.6731 0 32V3.2Z" fill="#F4F4F6"/>
              <path d="M32.0003 13.6667C42.1256 13.6667 50.3337 21.8748 50.3337 32.0001C50.3337 42.1253 42.1256 50.3334 32.0003 50.3334C21.8751 50.3334 13.667 42.1253 13.667 32.0001V13.6667H32.0003Z" stroke="#09090B" stroke-width="3.5"/>
              <path d="M12.833 32H51.1663" stroke="#09090B" stroke-width="3.5"/>
              <path d="M32 31.1667V51.1667" stroke="#09090B" stroke-width="3.5"/>
            </svg>
          </a>
        </div>
      </nav>
    </header>

    <!-- Main Workspace Stage (Vertically Fitted to Viewport) -->
    <main class="stage-container">
      <!-- Artwork Canvas Panel -->
      <div class="canvas-panel">
        <div class="canvas-header">
          <div class="canvas-title">
            <span id="opepen-badge" class="badge-token">ARGOPEPEN #0020</span>
          </div>
        </div>

        <!-- Canvas Viewport (Side-by-Side Artworks: No text, no extra decoration) -->
        <div class="canvas-frame" id="viewport">
          <div id="orig-svg-wrapper" class="svg-stage"></div>
          <div id="opepen-canvas-container" class="svg-stage"></div>
        </div>

        <!-- Unified Actions & Token Controls Bar -->
        <div class="actions-bar">
          <!-- Integrated # Token ID Input -->
          <div class="token-input-control">
            <span class="token-prefix">#</span>
            <input 
              type="number" 
              id="token-id-input" 
              placeholder="0020" 
              min="1" 
              max="9999" 
              value="20" 
              autocomplete="off"
              spellcheck="false"
              title="Enter Token ID (1-9999)"
            />
            <button id="btn-generate" class="btn-token-go" title="Synthesize Token ID">↵</button>
          </div>

          <!-- Random Shuffle Button -->
          <button id="btn-random" class="action-btn btn-random" title="Random Token Shuffle">🎲 RANDOM</button>

          <!-- 3. Single Download Dropdown Button -->
          <div class="download-dropdown-container" id="download-dropdown">
            <button id="btn-download-main" class="action-btn btn-download" title="Download Artwork" aria-haspopup="true" aria-expanded="false">
              <span>DOWNLOAD</span>
              <span class="dropdown-chevron">▾</span>
            </button>
            <div class="download-menu" id="download-menu" role="menu">
              <button class="download-option" data-format="svg" role="menuitem">
                <span class="opt-label">SVG</span>
                <span class="opt-sub">Vector</span>
              </button>
              <button class="download-option" data-format="png" role="menuitem">
                <span class="opt-label">PNG</span>
                <span class="opt-sub">2240×2240</span>
              </button>
              <button class="download-option" data-format="jpg" role="menuitem">
                <span class="opt-label">JPG</span>
                <span class="opt-sub">2240×2240</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Specification & Trait Architecture Panel -->
      <aside class="specs-panel">
        <div class="specs-header">
          <span class="specs-title">TRAIT ARCHITECTURE</span>
          <span id="token-contract-verified" class="status-tag">ON-CHAIN VERIFIED</span>
        </div>

        <!-- Layer Breakdown List (00 to 06) -->
        <div class="layers-list">
          <div class="layer-item">
            <span class="layer-num">00</span>
            <span class="layer-name">PALETTE</span>
            <span id="meta-palette" class="layer-val">—</span>
          </div>
          <div class="layer-item">
            <span class="layer-num">01</span>
            <span class="layer-name">BONES</span>
            <span id="meta-bones" class="layer-val">—</span>
          </div>
          <div class="layer-item">
            <span class="layer-num">02</span>
            <span class="layer-name">CLOAK</span>
            <span id="meta-cloak" class="layer-val">—</span>
          </div>
          <div class="layer-item">
            <span class="layer-num">03</span>
            <span class="layer-name">RELIC</span>
            <span id="meta-relic" class="layer-val">—</span>
          </div>
          <div class="layer-item">
            <span class="layer-num">04</span>
            <span class="layer-name">SIGHT</span>
            <span id="meta-sight" class="layer-val">—</span>
          </div>
          <div class="layer-item">
            <span class="layer-num">05</span>
            <span class="layer-name">ARTIFACT</span>
            <span id="meta-artifact" class="layer-val">—</span>
          </div>
          <div class="layer-item">
            <span class="layer-num">06</span>
            <span class="layer-name">CROWN</span>
            <span id="meta-crown" class="layer-val">—</span>
          </div>
        </div>

        <!-- Aligned Bottom Action Bar -->
        <div class="specs-bottom-bar">
          <button id="btn-copy-traits" class="action-btn btn-copy-traits" title="Copy Current Token Traits">
            <span class="btn-copy-icon">📋</span>
            <span>COPY TRAITS</span>
          </button>
        </div>
      </aside>
    </main>

    <!-- Curated Editions Gallery (15 Editions) -->
    <section class="gallery-block">
      <div class="gallery-header">
        <div class="gallery-title-wrap">
          <span class="gallery-tag">CURATED EDITIONS</span>
          <h2 class="gallery-heading">ARGOPEPEN EDITIONS</h2>
        </div>
        <div class="gallery-search-wrap">
          <div class="gallery-search-box">
            <span class="gallery-search-icon">🔍</span>
            <input 
              type="text" 
              id="gallery-trait-search" 
              placeholder="Search by trait (e.g. Clergy, Void, Woodpipe, Alien...)" 
              autocomplete="off" 
              spellcheck="false" 
              title="Search Argopepen by trait"
            />
            <button id="btn-clear-search" class="btn-clear-search" title="Clear search">✕</button>
          </div>
        </div>
        <span id="gallery-count-badge" class="gallery-count">15 EDITIONS</span>
      </div>
      <div id="gallery-grid" class="editions-grid">
        <!-- Injected dynamically via app.js -->
      </div>
    </section>

    <!-- Clean Minimalist Footer -->
    <footer class="footer">
      <div class="footer-author">
        <span class="tool-by">TOOL BY AJAY VIKRAM</span>
        <a href="https://x.com/avsingh_eth" target="_blank" rel="noopener noreferrer" class="footer-x-link" title="Ajay Vikram on X (@avsingh_eth)">
          <svg class="x-icon" viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          <span>@avsingh_eth</span>
        </a>
      </div>
    </footer>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Engine Data & Application Scripts -->
  <script src="engine_data.js?v=20260905_uipolish_v3"></script>
  <script src="app.js?v=20260905_uipolish_v3"></script>
</body>
</html>
